<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد دليل مدرستي</title>
<style>
  :root{
    --ink:#152524;
    --ink-soft:#4a5c5a;
    --paper:#eef3f1;
    --paper-raised:#ffffff;
    --teal-deep:#0f3d3a;
    --teal:#1c6b62;
    --teal-bright:#2e9e8b;
    --amber:#c9791e;
    --amber-soft:#f4e3cd;
    --line:#d4ddd9;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI','Tahoma','Geeza Pro',sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:640px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  header{
    background:var(--teal-deep);
    color:#fff;
    padding:22px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(46,158,139,.35), transparent 70%);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:1;
  }
  .brand-mark{
    width:42px;height:42px;border-radius:10px;
    background:var(--teal-bright);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;color:var(--teal-deep);
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:600;
    line-height:1.3;
  }
  header p{
    margin:4px 0 0;
    font-size:13px;
    color:#c7dcd8;
    font-weight:300;
  }
  .offline-badge{
    position:relative;
    z-index:1;
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    background:rgba(46,158,139,.22);
    border:1px solid rgba(255,255,255,.25);
    color:#d7ece8;
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
  }
  .offline-badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:#5fe3c4;
  }

  .chips{
    display:flex;
    gap:8px;
    padding:14px 16px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    background:var(--paper-raised);
    border:1px solid var(--line);
    color:var(--teal-deep);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, border-color .15s;
  }
  .chip:hover{ background:var(--amber-soft); border-color:var(--amber); }

  .chat{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:88%;
    padding:12px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.85;
    white-space:pre-wrap;
  }
  .msg.assistant{
    align-self:flex-start;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top-right-radius:4px;
  }
  .msg.assistant .steps{
    margin:8px 0 0;
    padding-inline-start:20px;
  }
  .msg.assistant .steps li{ margin-bottom:4px; }
  .msg.assistant .related{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .related-btn{
    display:inline-block;
    margin:4px 4px 0 0;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--teal);
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--teal-deep);
    color:#fff;
    border-top-left-radius:4px;
  }

  .input-bar{
    display:flex;
    gap:8px;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--paper-raised);
    border-top:1px solid var(--line);
  }
  .input-bar textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:100px;
    color:var(--ink);
    background:var(--paper);
  }
  .input-bar textarea:focus{
    outline:2px solid var(--teal-bright);
    outline-offset:1px;
  }
  .send-btn{
    width:46px;height:46px;
    border-radius:12px;
    border:none;
    background:var(--teal-deep);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background .15s;
  }
  .send-btn:hover{ background:var(--teal); }
  .send-btn svg{ width:19px; height:19px; transform:scaleX(-1); }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 16px 10px;
  }
</style>
</head>

        <p>يجاوبك من دليل المستخدم الرسمي — للطلاب والطالبات</p>
      </div>
    </div>
    <div class="offline-badge"><span class="dot"></span> يعمل بالكامل بدون إنترنت أو حساب</div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="chat" id="chat"></div>

  <div class="footnote">إجابات جاهزة من دليل منصة مدرستي. للمشاكل التقنية الفعلية استخدمي "الدعم الفني" داخل المنصة.</div>

  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="اكتب سؤالك عن منصة مدرستي..."></textarea>
    <button class="send-btn" id="sendBtn" aria-label="إرسال">

    </button>
  </div>
</div>

const QUICK_QUESTIONS = ["login","password","homework","exams","attendance","support","accessibility"];

const chatEl = document.getElementById('chat');
const chipsEl = document.getElementById('chips');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

const STOPWORDS = new Set(["كيف","وين","من","على","في","الى","إلى","ال","عن","ماذا","وش","ايش","اش","لو","هل","ابغى","ابي","اريد","أريد","اشوف","أشوف","أين"]);

function normalize(str){
  return str
    .replace(/[أإآ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .toLowerCase()
    .trim();
}

function tokenize(str){
  return normalize(str).split(/[\s،؟!.,]+/).filter(w => w.length > 1 && !STOPWORDS.has(w));
}

function scoreEntry(entry, queryTokens){
  const haystack = normalize(entry.q + " " + entry.keywords.join(" "));
  let score = 0;
  queryTokens.forEach(tok => {
    if(haystack.includes(tok)) score += tok.length;
  });
  return score;
}

function findBestMatches(query){
  const tokens = tokenize(query);
  if(tokens.length === 0) return [];
  const scored = KB.map(entry => ({ entry, score: scoreEntry(entry, tokens) }))
                    .filter(x => x.score > 0)
                    .sort((a,b) => b.score - a.score);
  return scored;
}

function renderAnswer(entry){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';

  const p = document.createElement('div');
  p.textContent = entry.answer;
  wrap.appendChild(p);

  if(entry.steps && entry.steps.length){
    const ol = document.createElement('ol');
    ol.className = 'steps';
    entry.steps.forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      ol.appendChild(li);
    });
    wrap.appendChild(ol);
  }

  if(entry.note){
    const note = document.createElement('div');
    note.style.marginTop = '8px';
    note.style.fontSize = '13px';
    note.style.color = 'var(--ink-soft)';
    note.textContent = entry.note;
    wrap.appendChild(note);
  }

  if(entry.related && entry.related.length){
    const relWrap = document.createElement('div');
    relWrap.className = 'related';
    relWrap.appendChild(document.createTextNode('أسئلة ذات صلة:'));
    const btnRow = document.createElement('div');
    entry.related.forEach(rid => {
      const relEntry = KB.find(e => e.id === rid);
      if(!relEntry) return;
      const b = document.createElement('button');
      b.className = 'related-btn';
      b.textContent = relEntry.q;
      b.onclick = () => askAndAnswer(relEntry.q);
      btnRow.appendChild(b);
    });
    relWrap.appendChild(btnRow);
    wrap.appendChild(relWrap);
  }

  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderNoMatch(){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.textContent = 'ما لقيت إجابة مطابقة لسؤالك في الدليل. جربي تعيدين صياغة السؤال بكلمات أبسط، أو اختاري أحد الأسئلة الجاهزة بالأعلى. لو المشكلة تقنية فعلية، استخدمي "الدعم الفني" داخل منصة مدرستي.';
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addUserMessage(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function askAndAnswer(query){
  addUserMessage(query);
  const matches = findBestMatches(query);
  setTimeout(() => {
    if(matches.length > 0){
      renderAnswer(matches[0].entry);
    }else{
      renderNoMatch();
    }
  }, 200);
}

QUICK_QUESTIONS.forEach(id => {
  const entry = KB.find(e => e.id === id);
  if(!entry) return;
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = entry.q;
  btn.onclick = () => askAndAnswer(entry.q);
  chipsEl.appendChild(btn);
});

function handleSend(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  askAndAnswer(text);
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});
